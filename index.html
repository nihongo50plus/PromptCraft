<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROMPT CRAFT — AI Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1c1c27;
    --border: #2a2a3a;
    --accent: #c8f53a; 
    --text: #e8e8f0;
    --muted: #6b6b85;
    --danger: #ff4d6d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; min-height: 100vh; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 30px 30px; z-index: -1; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; background: rgba(10,10,15,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 38px; letter-spacing: 2px; color: #fff; }
  .logo span { color: var(--accent); }

  main { max-width: 1400px; margin: 0 auto; padding: 40px; display: grid; grid-template-columns: 420px 1fr; gap: 40px; }
  .panel-left { display: flex; flex-direction: column; gap: 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  .section-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  
  .api-input { width: 100%; background: var(--bg); border: 1px solid var(--border); padding: 12px; color: var(--text); font-family: inherit; border-radius: 6px; outline: none; margin-bottom: 10px; }
  
  .upload-box { border: 2px dashed var(--border); border-radius: 12px; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; margin-bottom: 10px; }
  #preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }
  #preview-img.active { display: block; }

  select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 6px; font-family: inherit; margin-bottom: 15px; cursor: pointer; }
  
  .style-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
  .chip { background: var(--bg); border: 1px solid var(--border); padding: 10px; font-size: 11px; text-align: center; cursor: pointer; border-radius: 6px; color: var(--muted); }
  .chip.active { border-color: var(--accent); color: var(--accent); background: rgba(200,245,58,0.05); }

  .gen-btn { width: 100%; padding: 18px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-family: 'Bebas Neue', sans-serif; font-size: 26px; cursor: pointer; transition: 0.2s; }
  .gen-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .output-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; min-height: 500px; padding: 32px; display: flex; flex-direction: column; }
  .prompt-result { background: var(--bg); border: 1px solid var(--border); border-left: 4px solid var(--accent); padding: 24px; border-radius: 6px; line-height: 1.8; white-space: pre-wrap; margin-top: 10px; }
  .copy-btn { margin-top: 15px; background: var(--surface2); border: 1px solid var(--border); color: var(--accent); padding: 8px 16px; border-radius: 4px; cursor: pointer; align-self: flex-end; }
  
  .loader { display: none; flex-direction: column; align-items: center; margin: auto; }
  .error-view { color: var(--danger); display: none; }

  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <div class="logo">PROMPT<span>CRAFT</span></div>
</header>

<main>
  <div class="panel-left">
    <div class="card">
      <div class="section-label">1. API Settings</div>
      <input type="password" id="api-key" class="api-input" placeholder="Paste Gemini Key...">
      
      <div class="section-label">2. Target Platform</div>
      <select id="platform">
        <option>Midjourney</option>
        <option>Stable Diffusion XL</option>
        <option>Flux.1 [Dev]</option>
        <option>DALL-E 3</option>
      </select>

      <div class="section-label">3. Strategy</div>
      <select id="strategy">
        <option value="original">Original (Literal)</option>
        <option value="enhanced">Enhanced (Creative)</option>
      </select>

      <div class="section-label">4. Art Style</div>
      <div class="style-grid">
        <div class="chip active" data-val="Photorealistic">Photorealistic</div>
        <div class="chip" data-val="3D Render / CGI">3D Render</div>
        <div class="chip" data-val="Anime / Manga">Anime</div>
        <div class="chip" data-val="Cyberpunk">Cyberpunk</div>
        <div class="chip" data-val="Dark Fantasy">Dark Fantasy</div>
        <div class="chip" data-val="Oil Painting">Oil Painting</div>
      </div>

      <div class="section-label">5. Image Reference</div>
      <div class="upload-box" id="drop-zone">
        <img id="preview-img" alt="Preview">
        <p id="upload-text">Click or Drop Image</p>
      </div>
      <input type="file" id="file-input" accept="image/*" style="display:none">
      
      <button class="gen-btn" id="gen-btn" disabled>GENERATE PROMPT</button>
    </div>
  </div>

  <div class="panel-right">
    <div class="output-box">
      <div id="placeholder" style="margin:auto; color:var(--muted); text-align:center;">
        <p>Awaiting visual input...</p>
      </div>
      <div class="loader" id="loader">Processing Studio Request...</div>
      <div id="result-view" style="display:none; flex-direction:column">
        <div class="section-label">Final Prompt Output</div>
        <div class="prompt-result" id="prompt-text"></div>
        <button class="copy-btn" id="copy-btn">COPY TO CLIPBOARD</button>
      </div>
      <div class="error-view" id="error-view">
        <h3 style="font-family:'Bebas Neue'">Error Encountered</h3>
        <p id="error-msg"></p>
      </div>
    </div>
  </div>
</main>

<script>
let encodedImage = null;
let mimeType = null;
let selectedStyle = 'Photorealistic';
const apiKeyInput = document.getElementById('api-key');
const genBtn = document.getElementById('gen-btn');

apiKeyInput.value = localStorage.getItem('gemini_api_key') || "";
apiKeyInput.oninput = () => localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());

// Style chip selection
document.querySelectorAll('.chip').forEach(chip => {
  chip.onclick = () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    selectedStyle = chip.dataset.val;
  };
});

document.getElementById('drop-zone').onclick = () => document.getElementById('file-input').click();
document.getElementById('file-input').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  mimeType = file.type;
  const reader = new FileReader();
  reader.onload = (e) => {
    encodedImage = e.target.result.split(',')[1];
    document.getElementById('preview-img').src = e.target.result;
    document.getElementById('preview-img').classList.add('active');
    document.getElementById('upload-text').style.display = 'none';
    genBtn.disabled = false;
  };
  reader.readAsDataURL(file
