<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROMPT CRAFT — AI Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1c1c27;
    --border: #2a2a3a;
    --accent: #c8f53a; 
    --text: #e8e8f0;
    --muted: #6b6b85;
    --danger: #ff4d6d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid Background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 30px 30px;
    z-index: -1;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 40px;
    background: rgba(10,10,15,0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 38px; letter-spacing: 2px; color: #fff; }
  .logo span { color: var(--accent); }
  .header-badge { font-size: 11px; letter-spacing: 2px; color: var(--accent); border: 1px solid var(--accent); padding: 5px 12px; border-radius: 4px; text-transform: uppercase; }

  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 40px;
    display: grid;
    grid-template-columns: 420px 1fr;
    gap: 40px;
    align-items: start;
  }

  .panel-left, .panel-right { display: flex; flex-direction: column; gap: 24px; min-width: 0; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .section-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label i { color: var(--accent); font-style: normal; font-weight: bold; }

  /* Inputs */
  .api-wrap { display: flex; gap: 8px; }
  .api-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 12px;
    color: var(--text);
    font-family: inherit;
    border-radius: 6px;
    outline: none;
    font-size: 13px;
  }
  .api-input:focus { border-color: var(--accent); }
  
  .btn-icon {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    width: 45px;
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Upload Area */
  .upload-box {
    border: 2px dashed var(--border);
    border-radius: 12px;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    background: rgba(255,255,255,0.01);
    position: relative;
    overflow: hidden;
  }
  .upload-box:hover { border-color: var(--accent); background: rgba(200,245,58,0.03); }
  
  #preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }
  #preview-img.active { display: block; }
  
  .upload-prompt { text-align: center; color: var(--muted); }
  .upload-prompt.hidden { display: none; }

  .remove-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    background: var(--danger);
    color: white;
    border: none;
    padding: 6px 12px;
    font-size: 10px;
    border-radius: 4px;
    cursor: pointer;
    display: none;
    z-index: 10;
  }

  /* Dropdowns & Selects */
  select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px;
    border-radius: 6px;
    font-family: inherit;
    appearance: none;
    cursor: pointer;
  }

  .style-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chip {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 12px;
    font-size: 11px;
    text-align: center;
    cursor: pointer;
    border-radius: 6px;
    color: var(--muted);
    transition: 0.2s;
  }
  .chip.active { border-color: var(--accent); color: var(--accent); background: rgba(200,245,58,0.08); font-weight: 500; }

  .gen-btn {
    width: 100%;
    padding: 18px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 10px;
  }
  .gen-btn:disabled { background: var(--surface2); color: var(--muted); cursor: not-allowed; opacity: 0.5; }
  .gen-btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 0 20px rgba(200,245,58,0.3); }

  /* Output Panel */
  .output-title { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 2px; margin-bottom: 20px; color: #fff; }

  .output-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    min-height: 450px;
    padding: 32px;
    display: flex;
    flex-direction: column;
  }

  .placeholder-view {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  .loader { display: none; flex-direction: column; align-items: center; justify-content: center; margin: auto; gap: 20px; }
  .loader-bar { width: 200px; height: 2px; background: var(--border); position: relative; overflow: hidden; }
  .loader-progress { width: 60px; height: 100%; background: var(--accent); position: absolute; animation: move 1.2s infinite ease-in-out; }
  @keyframes move { 0% { left: -60px; } 100% { left: 200px; } }

  .prompt-result {
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    padding: 24px;
    border-radius: 6px;
    line-height: 1.8;
    font-size: 15px;
    color: var(--text);
    white-space: pre-wrap;
    position: relative;
  }
  
  .copy-btn {
    margin-top: 15px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--accent);
    padding: 8px 16px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    align-self: flex-end;
  }

  .error-view { color: var(--danger); display: none; }
  .error-view h3 { font-family: 'Bebas Neue', sans-serif; font-size: 32px; margin-bottom: 10px; }

  /* History */
  .history-item {
    padding: 15px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 13px;
    cursor: pointer;
    transition: 0.2s;
  }
  .history-item:hover { border-color: var(--accent); background: var(--surface2); }
  .history-time { color: var(--accent); font-weight: bold; margin-right: 10px; }

  footer {
    padding: 40px;
    text-align: center;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  @media (max-width: 1100px) {
    main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">PROMPT<span>CRAFT</span></div>
  <div class="header-badge">Standalone Intelligence Studio</div>
</header>

<main>
  <div class="panel-left">
    <div class="card">
      <div class="section-label"><i>⚡</i> Google Gemini API Key</div>
      <div class="api-wrap">
        <input type="password" id="api-key" class="api-input" placeholder="Enter API Key...">
        <button class="btn-icon" id="toggle-key">👁</button>
      </div>
      <p style="font-size: 10px; color: var(--muted); margin-top: 10px;">Your key is stored safely in your browser.</p>
    </div>

    <div class="section-label">① Upload Reference</div>
    <div class="upload-box" id="drop-zone">
      <img id="preview-img" alt="Preview">
      <div class="upload-prompt" id="upload-prompt">
        <div style="font-size: 40px; color: var(--accent); margin-bottom: 10px;">+</div>
        <p>Drop image here or click</p>
      </div>
      <button class="remove-btn" id="remove-btn">REMOVE IMAGE</button>
    </div>
    <input type="file" id="file-input" accept="image/*" style="display:none">

    <div class="card">
      <div style="margin-bottom: 20px;">
        <div class="section-label">② Target Platform</div>
        <select id="platform">
          <option>Midjourney</option>
          <option>Stable Diffusion XL</option>
          <option>Flux.1 [Dev]</option>
          <option>DALL-E 3</option>
        </select>
      </div>
      
      <div>
        <div class="section-label">③ Output Style</div>
        <div class="style-grid">
          <div class="chip active" data-val="Photorealistic">Photorealistic</div>
          <div
